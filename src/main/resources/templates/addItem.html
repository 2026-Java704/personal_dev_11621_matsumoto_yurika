<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>家計簿</title>
	<link rel="stylesheet" type="text/css" href="/css/style.css">

</head>

<body>
	<header th:replace="~{header}"> </header>

	<div class="grid-area">

		<div class="top-area">
			<span th:text="${@account.userName}+' の庭'"></span>
			<br>

			<img th:src="@{/images/udekumi-harinezumi.png}" alt="ハリネズミ（考える）" height="100px">
		</div>



		<div class="bottom-area">
			<nav>
				<h1>追加</h1>
			</nav>

			<form action="/items/add" method="post">

				<ul th:if="${errorList}" class="error">
					<li th:each="error:${errorList}" th:text="${error}" style="color:red"></li>
				</ul>

				<table border="1">
					<tr>
						<th>日付</th>
						<td><input type="date" name="addDate"></td>
					</tr>

					<tr>
						<th>名前</th>
						<td><input type="text" name="itemName"></td>
					</tr>

					<tr>
						<th>ジャンル</th>
						<td>
							<select name="genreId">
								<option value="" disabled selected>選択してください</option>
								<option th:each="genre:${genreList}" th:value="${genre.id}">
									[[${genre.genreName}]]
								</option>
							</select>
						</td>
					</tr>

					<tr>
						<th>金額</th>
						<td><input type="text" name="price"></td>
					</tr>

					<tr>
						<th>コメント</th>
						<td><input type="text" name="comment"></td>
					</tr>

				</table>

				<div class="form-submit">
					<button type="submit">追加</button>
				</div>

			</form>

			<div class="price-area">
				<form action="/items" method="get">
					<button>一覧に戻る</button>
				</form>
			</div>


		</div>

	</div>

	<footer th:replace="~{footer}"></footer>
</body>


</html>
